name: Build and publish to PyPI
run-name: PyPI ${{ inputs.version }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in pyproject.toml (for example, 0.1.0)
        required: true
        type: string
      publish:
        description: Publish the validated distributions to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hygonstat-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate release source and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          import hygonstat

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Release builds must run from main")
          if os.environ["GITHUB_REPOSITORY"] != "gosgjkaj/hygonstat":
              raise SystemExit("Configure your own publisher before publishing a fork")
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected = os.environ["EXPECTED_VERSION"]
          if project["version"] != expected or hygonstat.__version__ != expected:
              raise SystemExit("Input, package metadata and __version__ must match")
          print(f"Building {project['name']} {expected} from {os.environ['GITHUB_SHA']}")
          PY
      - name: Install build tools and package
        run: python -m pip install build twine .
      - name: Run offline tests
        run: python -I -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, "Expected one wheel and one sdist"
          with zipfile.ZipFile(wheels[0]) as archive:
              assert all(name.startswith("hygonstat/") or ".dist-info/" in name
                         for name in archive.namelist()), "Unexpected wheel contents"
          with tarfile.open(sdists[0]) as archive:
              names = {name.partition("/")[2] for name in archive.getnames()}
          required = {"LICENSE", "NOTICE", "tests/test_backend.py",
                      "tests/fixtures/sugon-smi.txt", "scripts/install-system.sh"}
          assert required <= names, f"Missing source files: {required - names}"
          PY
      - name: Check wheel in a clean environment
        run: |
          python -m venv /tmp/hygonstat-wheel-check
          /tmp/hygonstat-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/hygonstat-wheel-check/bin/python -I -m hygonstat --version
          /tmp/hygonstat-wheel-check/bin/hygonstat --help
      - name: Upload distributions for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hygonstat/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
